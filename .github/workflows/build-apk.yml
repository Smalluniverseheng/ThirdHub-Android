name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 生成 Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: 构建 APK
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: 读取版本号
        id: ver
        run: echo "v=$(grep -oP 'versionName "\K[0-9.]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: 重命名产物
        run: cp app/build/outputs/apk/release/app-release.apk "ThirdHub-Android-v${{ steps.ver.outputs.v }}.apk"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ThirdHub-Android-v${{ steps.ver.outputs.v }}-apk
          path: ThirdHub-Android-v${{ steps.ver.outputs.v }}.apk
          retention-days: 90
